<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS AI — Advanced Neural Interface</title>
<style>
/* ============================================================
   CONFIGURAÇÃO / RESET
   ============================================================ */
:root{
  --nx-bg:#04070d;
  --nx-bg2:#060b16;
  --nx-cyan:#3ee6ff;
  --nx-cyan-dim:#1a7f94;
  --nx-blue:#5b8cff;
  --nx-violet:#8a6bff;
  --nx-magenta:#ff5fd0;
  --nx-text:#d9f4ff;
  --nx-text-dim:#6f92a8;
  --nx-glass:rgba(10,22,38,0.45);
  --nx-glass-border:rgba(62,230,255,0.25);
  --nx-danger:#ff4d6d;
  --nx-ok:#3effa0;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 30%, #061224 0%, #030509 60%, #000103 100%);
  overflow:hidden;
  font-family:'Consolas','Courier New',monospace;
  color:var(--nx-text);
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

#app{
  position:fixed; inset:0;
  width:100vw; height:100vh;
  overflow:hidden;
}

#canvas-container{
  position:absolute; inset:0; z-index:1;
}
#canvas-container canvas{display:block;}

.scanlines{
  position:fixed; inset:0; z-index:5; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(62,230,255,0.015) 0px,
    rgba(62,230,255,0.015) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode:screen;
}
.vignette{
  position:fixed; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,2,5,0.75) 100%);
}
.grid-floor{
  position:fixed; left:0; right:0; bottom:0; height:40vh; z-index:2; pointer-events:none;
  background-image:
    linear-gradient(rgba(62,230,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(62,230,255,0.06) 1px, transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  mask-image:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  transform:perspective(400px) rotateX(60deg);
  transform-origin:bottom;
  opacity:0.5;
}

/* ============================================================
   INTERFACE / HUD LAYOUT
   ============================================================ */
.hud{
  position:fixed; inset:0; z-index:10;
  pointer-events:none;
  display:grid;
  grid-template-columns:280px 1fr 280px;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "top top top"
    "left center right"
    "bottom bottom bottom";
  padding:18px 22px;
  gap:12px;
}
.hud > *{pointer-events:auto;}

.top-bar{
  grid-area:top;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding-bottom:6px;
}
.brand{display:flex; flex-direction:column; gap:2px;}
.brand-title{
  font-family:'Orbitron','Consolas',sans-serif;
  font-size:26px; letter-spacing:8px; font-weight:700;
  color:var(--nx-cyan);
  text-shadow:0 0 12px rgba(62,230,255,0.8), 0 0 28px rgba(62,230,255,0.35);
}
.brand-sub{
  font-size:10px; letter-spacing:4px; color:var(--nx-text-dim);
  margin-left:2px;
}
.status-online{
  display:flex; align-items:center; gap:8px;
  font-size:11px; letter-spacing:3px; color:var(--nx-ok);
  padding:8px 14px;
  border:1px solid rgba(62,230,255,0.25);
  border-radius:4px;
  background:var(--nx-glass);
  backdrop-filter:blur(6px);
}
.status-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--nx-ok);
  box-shadow:0 0 8px var(--nx-ok), 0 0 16px var(--nx-ok);
  animation:pulseDot 1.6s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1; transform:scale(1);}
  50%{opacity:0.4; transform:scale(0.75);}
}

.panel{
  background:var(--nx-glass);
  border:1px solid var(--nx-glass-border);
  border-radius:6px;
  backdrop-filter:blur(8px);
  padding:14px 16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 24px rgba(0,0,0,0.35), inset 0 0 30px rgba(62,230,255,0.03);
  transition:box-shadow 0.3s ease, border-color 0.3s ease;
}
.panel:hover{
  border-color:rgba(62,230,255,0.5);
  box-shadow:0 0 28px rgba(62,230,255,0.15), inset 0 0 30px rgba(62,230,255,0.06);
}
.panel::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--nx-cyan), transparent);
  opacity:0.6;
}
.panel-title{
  font-size:11px; letter-spacing:3px; color:var(--nx-cyan);
  margin-bottom:12px; display:flex; align-items:center; gap:8px;
  text-shadow:0 0 8px rgba(62,230,255,0.5);
}
.panel-title::before{
  content:''; width:5px; height:5px; background:var(--nx-cyan);
  box-shadow:0 0 6px var(--nx-cyan); display:inline-block; flex-shrink:0;
}

.left-panel{grid-area:left; display:flex; flex-direction:column; gap:12px; align-self:start;}
.right-panel{grid-area:right; display:flex; flex-direction:column; gap:12px; align-self:start;}

.metric-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; letter-spacing:1px; margin-bottom:8px; color:var(--nx-text-dim);
}
.metric-row span.val{color:var(--nx-text); font-weight:bold;}
.bar-track{
  width:100%; height:5px; background:rgba(62,230,255,0.08);
  border-radius:3px; overflow:hidden; margin-bottom:10px;
  border:1px solid rgba(62,230,255,0.1);
}
.bar-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--nx-cyan-dim), var(--nx-cyan));
  box-shadow:0 0 8px rgba(62,230,255,0.6);
  transition:width 0.6s ease;
  width:0%;
}
.mini-note{
  font-size:9px; letter-spacing:1.5px; color:var(--nx-text-dim);
  margin-top:2px; display:flex; align-items:center; gap:6px;
}
.mini-note .dot{width:6px;height:6px;border-radius:50%;background:var(--nx-ok); box-shadow:0 0 6px var(--nx-ok); flex-shrink:0;}

.freq-canvas-wrap{
  width:100%; height:70px; position:relative;
  border:1px solid rgba(62,230,255,0.12); border-radius:4px;
  background:rgba(0,10,20,0.4); overflow:hidden;
}
#freqCanvas{width:100%; height:100%; display:block;}

.audio-metrics{margin-top:10px; display:flex; flex-direction:column; gap:8px;}

.center-col{
  grid-area:center;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  gap:16px;
  pointer-events:none;
}
.state-label{
  font-size:13px; letter-spacing:6px; color:var(--nx-cyan);
  text-shadow:0 0 14px rgba(62,230,255,0.7);
  text-align:center;
  min-height:18px;
  transition:color 0.3s ease;
  pointer-events:none;
}
.state-label.listening{color:var(--nx-ok); text-shadow:0 0 14px rgba(62,255,160,0.7);}
.state-label.processing{color:var(--nx-violet); text-shadow:0 0 14px rgba(138,107,255,0.8);}
.state-label.responding{color:var(--nx-magenta); text-shadow:0 0 14px rgba(255,95,208,0.8);}

.transcript-box{
  max-width:520px; width:90%;
  min-height:0;
  text-align:center;
  pointer-events:none;
  display:flex; flex-direction:column; gap:6px;
}
.transcript-line{
  font-size:11px; letter-spacing:2px; color:var(--nx-text-dim);
  opacity:0; transform:translateY(6px);
  transition:opacity 0.4s ease, transform 0.4s ease;
}
.transcript-line.show{opacity:1; transform:translateY(0);}
.transcript-line .who{color:var(--nx-cyan); font-weight:bold; margin-right:6px;}
.transcript-line.nexus .who{color:var(--nx-magenta);}
.transcript-line .txt{color:var(--nx-text); letter-spacing:0.5px;}

.mic-btn{
  pointer-events:auto;
  width:76px; height:76px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(62,230,255,0.25), rgba(6,12,22,0.9));
  border:2px solid rgba(62,230,255,0.55);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative;
  box-shadow:0 0 18px rgba(62,230,255,0.35), inset 0 0 20px rgba(62,230,255,0.1);
  transition:transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  margin-bottom:4px;
}
.mic-btn:hover{transform:scale(1.06); box-shadow:0 0 28px rgba(62,230,255,0.55), inset 0 0 24px rgba(62,230,255,0.18);}
.mic-btn:active{transform:scale(0.96);}
.mic-btn.active{
  border-color:var(--nx-ok);
  box-shadow:0 0 30px rgba(62,255,160,0.55), inset 0 0 24px rgba(62,255,160,0.15);
  animation:micPulse 1.4s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 20px rgba(62,255,160,0.4), inset 0 0 20px rgba(62,255,160,0.1);}
  50%{box-shadow:0 0 42px rgba(62,255,160,0.75), inset 0 0 28px rgba(62,255,160,0.2);}
}
.mic-btn svg{width:28px; height:28px; fill:none; stroke:var(--nx-cyan); stroke-width:1.6;}
.mic-btn.active svg{stroke:var(--nx-ok);}
.mic-ring{
  position:absolute; inset:-10px; border-radius:50%;
  border:1px solid rgba(62,230,255,0.3);
  opacity:0;
}
.mic-btn.active .mic-ring{animation:ringExpand 1.6s ease-out infinite;}
@keyframes ringExpand{
  0%{opacity:0.7; transform:scale(0.9);}
  100%{opacity:0; transform:scale(1.6);}
}
.mic-hint{
  font-size:9px; letter-spacing:2px; color:var(--nx-text-dim);
  text-align:center; pointer-events:none;
}

.bottom-console{
  grid-area:bottom;
  background:var(--nx-glass);
  border:1px solid var(--nx-glass-border);
  border-radius:6px;
  backdrop-filter:blur(8px);
  padding:10px 16px;
  max-height:118px;
  display:flex; flex-direction:column;
  box-shadow:0 0 24px rgba(0,0,0,0.35);
  position:relative;
  overflow:hidden;
}
.bottom-console::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--nx-cyan), transparent);
  opacity:0.6;
}
.console-title{
  font-size:10px; letter-spacing:3px; color:var(--nx-cyan);
  margin-bottom:6px; flex-shrink:0;
}
.console-log{
  font-size:11px; line-height:1.6; color:var(--nx-ok);
  overflow-y:auto; flex:1;
  scrollbar-width:thin;
}
.console-log::-webkit-scrollbar{width:4px;}
.console-log::-webkit-scrollbar-thumb{background:rgba(62,230,255,0.3); border-radius:2px;}
.console-log div{opacity:0; animation:logIn 0.4s ease forwards;}
@keyframes logIn{from{opacity:0; transform:translateX(-4px);} to{opacity:1; transform:translateX(0);}}
.console-log .warn{color:#ffcc55;}
.console-log .err{color:var(--nx-danger);}
.console-log .sys{color:var(--nx-text-dim);}

.compat-warning{
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  z-index:50; pointer-events:none;
  background:rgba(20,4,8,0.75); border:1px solid rgba(255,77,109,0.5);
  color:var(--nx-danger); font-size:11px; letter-spacing:2px;
  padding:8px 18px; border-radius:4px; backdrop-filter:blur(6px);
  display:none;
  box-shadow:0 0 20px rgba(255,77,109,0.25);
}

@media (max-width:1100px){
  .hud{
    grid-template-columns:1fr;
    grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:
      "top"
      "sidecards"
      "center"
      "bottom"
      "spacer";
  }
  .left-panel, .right-panel{
    grid-area:sidecards;
    flex-direction:row;
    flex-wrap:wrap;
  }
  .left-panel{order:1;}
  .right-panel{order:1; margin-top:8px;}
  .panel{flex:1 1 240px; min-width:220px;}
  .brand-title{font-size:20px; letter-spacing:5px;}
}

@media (max-width:640px){
  .hud{padding:12px; gap:8px;}
  .brand-title{font-size:16px; letter-spacing:3px;}
  .brand-sub{font-size:8px; letter-spacing:2px;}
  .status-online{font-size:9px; padding:6px 10px; letter-spacing:1.5px;}
  .left-panel{display:flex; order:2;}
  .right-panel{display:none;}
  .panel{padding:10px 12px;}
  .panel-title{font-size:9px; margin-bottom:8px;}
  .metric-row{font-size:9px;}
  .mic-btn{width:64px; height:64px;}
  .mic-btn svg{width:22px; height:22px;}
  .bottom-console{max-height:80px;}
  .console-log{font-size:9px;}
  .transcript-box{width:96%;}
  .transcript-line{font-size:9px;}
  .state-label{font-size:11px; letter-spacing:4px;}
  .grid-floor{height:25vh;}
}

@media (max-width:400px){
  .left-panel .panel:nth-child(3){display:none;}
}
</style>
</head>
<body>

<div id="app">
  <div id="canvas-container"></div>
  <div class="grid-floor"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="compat-warning" id="compatWarning">VOICE INTERFACE NOT AVAILABLE</div>

  <div class="hud">
    <!-- TOP -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-title">NEXUS AI</div>
        <div class="brand-sub">ADVANCED NEURAL INTERFACE</div>
      </div>
      <div class="status-online"><span class="status-dot"></span> ONLINE</div>
    </div>

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="panel" id="statusPanel">
        <div class="panel-title">SYSTEM STATUS</div>
        <div class="metric-row"><span>CPU</span><span class="val" id="cpuVal">42%</span></div>
        <div class="bar-track"><div class="bar-fill" id="cpuBar" style="width:42%"></div></div>
        <div class="metric-row"><span>MEMORY</span><span class="val" id="memVal">68%</span></div>
        <div class="bar-track"><div class="bar-fill" id="memBar" style="width:68%"></div></div>
        <div class="metric-row"><span>NEURAL CORE</span><span class="val" id="neuralVal">97%</span></div>
        <div class="bar-track"><div class="bar-fill" id="neuralBar" style="width:97%"></div></div>
        <div class="metric-row"><span>NETWORK</span><span class="val" id="netVal">99%</span></div>
        <div class="bar-track"><div class="bar-fill" id="netBar" style="width:99%"></div></div>
        <div class="mini-note"><span class="dot" id="audioDot"></span><span id="audioInputText">AUDIO INPUT STANDBY</span></div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center-col">
      <div class="transcript-box" id="transcriptBox"></div>
      <div class="state-label" id="stateLabel">AGUARDANDO COMANDO</div>
      <button class="mic-btn" id="micBtn" aria-label="Ativar microfone">
        <div class="mic-ring"></div>
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </button>
      <div class="mic-hint" id="micHint">TOQUE PARA FALAR</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="panel">
        <div class="panel-title">AUDIO ANALYSIS</div>
        <div class="freq-canvas-wrap"><canvas id="freqCanvas"></canvas></div>
        <div class="audio-metrics">
          <div class="metric-row"><span>FREQUENCY</span><span class="val" id="freqVal">— Hz</span></div>
          <div class="metric-row"><span>AMPLITUDE</span><span class="val" id="ampVal">0.00</span></div>
          <div class="metric-row"><span>VOICE LEVEL</span><span class="val" id="voiceVal">LOW</span></div>
          <div class="metric-row"><span>SIGNAL</span><span class="val" id="signalVal">STABLE</span></div>
        </div>
      </div>
    </div>

    <!-- BOTTOM CONSOLE -->
    <div class="bottom-console">
      <div class="console-title">NEXUS CONSOLE</div>
      <div class="console-log" id="consoleLog"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   CONFIGURAÇÃO DA IA (LINKS E MODELOS ATUALIZADOS)
   ============================================================ */
// ATENÇÃO: Confirme se este link é o mesmo gerado na tela preta atual do túnel!
const OLLAMA_URL = "https://1fe37640f50654d2-201-57-125-34.serveousercontent.com/api/generate";
const OLLAMA_MODEL = "gemma3:1b"; 
const SYSTEM_PROMPT = "Você é NEXUS, uma interface neural e inteligência artificial holográfica avançada. Responda de forma concisa, direta e com um tom futurista, lógico e prestativo. Nunca use formatação markdown ou emojis nas suas respostas, pois elas serão lidas por um sintetizador de voz. Fale sempre em português do Brasil.";

const PARTICLE_COUNT = (function(){
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const lowCores = (navigator.hardwareConcurrency || 4) <= 2;
  if (isMobile || lowCores) return 1200;
  return 2200;
})();
const ORBIT_PARTICLE_COUNT = Math.round(PARTICLE_COUNT * 0.35);
const SPHERE_RADIUS = 3.2;

const state = {
  mode:'IDLE', 
  volume:0, volumeSmooth:0, 
  bass:0, mid:0, treble:0,
  bassSmooth:0, midSmooth:0, trebleSmooth:0,
  hasMic:false, simulated:false,
  mouseNX:0, mouseNY:0, 
  shock:0 
};

/* ============================================================
   CONSOLE / LOG
   ============================================================ */
const consoleLog = document.getElementById('consoleLog');
function logMsg(text, cls){
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = '> ' + text;
  consoleLog.appendChild(line);
  consoleLog.scrollTop = consoleLog.scrollHeight;
  while(consoleLog.children.length > 40){ consoleLog.removeChild(consoleLog.firstChild); }
}

const metricEls = {
  cpu:{val:document.getElementById('cpuVal'), bar:document.getElementById('cpuBar'), base:42},
  mem:{val:document.getElementById('memVal'), bar:document.getElementById('memBar'), base:68},
  neural:{val:document.getElementById('neuralVal'), bar:document.getElementById('neuralBar'), base:97},
  net:{val:document.getElementById('netVal'), bar:document.getElementById('netBar'), base:99}
};
function driftMetrics(){
  Object.keys(metricEls).forEach(k=>{
    const m = metricEls[k];
    let jitter = (Math.random()*10-5);
    let boost = (k==='cpu' || k==='neural') ? state.volumeSmooth*18 : state.volumeSmooth*6;
    let v = Math.max(5, Math.min(100, m.base + jitter*0.4 + boost));
    m.val.textContent = Math.round(v) + '%';
    m.bar.style.width = v + '%';
  });
}
setInterval(driftMetrics, 1400);
driftMetrics();

const audioDot = document.getElementById('audioDot');
const audioInputText = document.getElementById('audioInputText');

const freqCanvas = document.getElementById('freqCanvas');
const freqCtx = freqCanvas.getContext('2d');
function resizeFreqCanvas(){
  const rect = freqCanvas.getBoundingClientRect();
  freqCanvas.width = rect.width * devicePixelRatio;
  freqCanvas.height = rect.height * devicePixelRatio;
}
resizeFreqCanvas();
window.addEventListener('resize', resizeFreqCanvas);

const freqValEl = document.getElementById('freqVal');
const ampValEl = document.getElementById('ampVal');
const voiceValEl = document.getElementById('voiceVal');
const signalValEl = document.getElementById('signalVal');

let simPhase = 0;
function drawFreqCanvas(dataArray){
  const w = freqCanvas.width, h = freqCanvas.height;
  freqCtx.clearRect(0,0,w,h);
  const bars = 40;
  const gap = w/bars;
  for(let i=0;i<bars;i++){
    let v;
    if(dataArray){
      const idx = Math.floor((i/bars) * dataArray.length * 0.6);
      v = dataArray[idx] / 255;
    } else {
      v = (Math.sin(simPhase*0.12 + i*0.5) * 0.5 + 0.5) * 0.55 + Math.random()*0.08;
    }
    const barH = Math.max(2, v * h * 0.92);
    const grad = freqCtx.createLinearGradient(0, h-barH, 0, h);
    grad.addColorStop(0, 'rgba(62,230,255,0.95)');
    grad.addColorStop(1, 'rgba(62,230,255,0.15)');
    freqCtx.fillStyle = grad;
    freqCtx.fillRect(i*gap+1, h-barH, gap-2, barH);
  }
  simPhase++;
}

/* ============================================================
   THREE.JS — CENA
   ============================================================ */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040710, 0.045);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 0.4, 9.5);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const coreGroup = new THREE.Group();
scene.add(coreGroup);

const sphereGeo = new THREE.BufferGeometry();
const basePositions = new Float32Array(PARTICLE_COUNT*3);
const dirVectors = new Float32Array(PARTICLE_COUNT*3);
const sizes = new Float32Array(PARTICLE_COUNT);
const seeds = new Float32Array(PARTICLE_COUNT);
const colors = new Float32Array(PARTICLE_COUNT*3);

const colorCyan = new THREE.Color(0x3ee6ff);
const colorBlue = new THREE.Color(0x5b8cff);
const colorViolet = new THREE.Color(0x9a7bff);

for(let i=0;i<PARTICLE_COUNT;i++){
  const t = i / PARTICLE_COUNT;
  const phi = Math.acos(1 - 2*t);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;

  const x = Math.sin(phi) * Math.cos(theta);
  const y = Math.sin(phi) * Math.sin(theta);
  const z = Math.cos(phi);

  const r = SPHERE_RADIUS * (0.92 + Math.random()*0.08);

  basePositions[i*3] = x * r;
  basePositions[i*3+1] = y * r;
  basePositions[i*3+2] = z * r;

  dirVectors[i*3] = x;
  dirVectors[i*3+1] = y;
  dirVectors[i*3+2] = z;

  sizes[i] = 0.028 + Math.random()*0.045;
  seeds[i] = Math.random()*1000;

  const mixT = Math.random();
  const c = colorCyan.clone().lerp(mixT > 0.6 ? colorViolet : colorBlue, mixT>0.6? (mixT-0.6)/0.4 : mixT*0.5);
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
}
sphereGeo.setAttribute('position', new THREE.BufferAttribute(basePositions.slice(), 3));
sphereGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
sphereGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const sphereMat = new THREE.PointsMaterial({
  size:0.09,
  vertexColors:true,
  transparent:true,
  opacity:0.95,
  blending:THREE.AdditiveBlending,
  depthWrite:false,
  sizeAttenuation:true
});
const spherePoints = new THREE.Points(sphereGeo, sphereMat);
coreGroup.add(spherePoints);

function makeGlowSprite(color, size, opacity){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0, `rgba(${color},${opacity})`);
  g.addColorStop(0.4, `rgba(${color},${opacity*0.45})`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(size,size,1);
  return sprite;
}
const coreGlow = makeGlowSprite('62,230,255', 7.5, 0.9);
coreGroup.add(coreGlow);
const coreGlowInner = makeGlowSprite('180,230,255', 3.2, 1.0);
coreGroup.add(coreGlowInner);

const orbitGeo = new THREE.BufferGeometry();
const orbitPositions = new Float32Array(ORBIT_PARTICLE_COUNT*3);
const orbitRadii = new Float32Array(ORBIT_PARTICLE_COUNT);
const orbitAngles = new Float32Array(ORBIT_PARTICLE_COUNT);
const orbitSpeeds = new Float32Array(ORBIT_PARTICLE_COUNT);
const orbitTilt = new Float32Array(ORBIT_PARTICLE_COUNT);
const orbitSizes = new Float32Array(ORBIT_PARTICLE_COUNT);
const orbitColors = new Float32Array(ORBIT_PARTICLE_COUNT*3);

for(let i=0;i<ORBIT_PARTICLE_COUNT;i++){
  orbitRadii[i] = SPHERE_RADIUS * (1.25 + Math.random()*0.9);
  orbitAngles[i] = Math.random()*Math.PI*2;
  orbitSpeeds[i] = 0.08 + Math.random()*0.22;
  orbitTilt[i] = (Math.random()-0.5)*1.4;
  orbitSizes[i] = 0.02 + Math.random()*0.03;
  const c = colorCyan.clone().lerp(colorViolet, Math.random());
  orbitColors[i*3]=c.r; orbitColors[i*3+1]=c.g; orbitColors[i*3+2]=c.b;
  orbitPositions[i*3]=0; orbitPositions[i*3+1]=0; orbitPositions[i*3+2]=0;
}
orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPositions,3));
orbitGeo.setAttribute('color', new THREE.BufferAttribute(orbitColors,3));
const orbitMat = new THREE.PointsMaterial({
  size:0.045, vertexColors:true, transparent:true, opacity:0.85,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
});
const orbitPoints = new THREE.Points(orbitGeo, orbitMat);
coreGroup.add(orbitPoints);

function makeRing(radius, color, opacity, tiltX, tiltY){
  const geo = new THREE.RingGeometry(radius, radius+0.02, 128);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = tiltX;
  mesh.rotation.y = tiltY;
  return mesh;
}
const rings = [
  makeRing(SPHERE_RADIUS+0.9, 0x3ee6ff, 0.35, Math.PI/2.1, 0.3),
  makeRing(SPHERE_RADIUS+1.35, 0x8a6bff, 0.22, Math.PI/2.6, -0.5),
  makeRing(SPHERE_RADIUS+1.7, 0x5b8cff, 0.15, Math.PI/1.8, 0.9)
];
rings.forEach(r=>coreGroup.add(r));

const shockWaves = [];
function spawnShockWave(){
  const geo = new THREE.RingGeometry(SPHERE_RADIUS*0.9, SPHERE_RADIUS*0.98, 64);
  const mat = new THREE.MeshBasicMaterial({
    color:0x3ee6ff, transparent:true, opacity:0.6, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = Math.random()*Math.PI;
  mesh.rotation.y = Math.random()*Math.PI;
  mesh.userData.life = 0;
  coreGroup.add(mesh);
  shockWaves.push(mesh);
}

const starGeo = new THREE.BufferGeometry();
const STAR_COUNT = 900;
const starPos = new Float32Array(STAR_COUNT*3);
for(let i=0;i<STAR_COUNT;i++){
  starPos[i*3] = (Math.random()-0.5)*60;
  starPos[i*3+1] = (Math.random()-0.5)*60;
  starPos[i*3+2] = (Math.random()-0.5)*60 - 10;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({color:0x4488aa, size:0.045, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false});
const starField = new THREE.Points(starGeo, starMat);
scene.add(starField);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('mousemove', (e)=>{
  state.mouseNX = (e.clientX / window.innerWidth) * 2 - 1;
  state.mouseNY = -((e.clientY / window.innerHeight) * 2 - 1);
});
window.addEventListener('touchmove', (e)=>{
  if(e.touches && e.touches[0]){
    state.mouseNX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    state.mouseNY = -((e.touches[0].clientY / window.innerHeight) * 2 - 1);
  }
}, {passive:true});

/* ============================================================
   ÁUDIO — Web Audio API
   ============================================================ */
let audioCtx, analyser, micSource, dataArrayFreq, dataArrayTime;
let micStream = null;

function lerp(a,b,t){ return a + (b-a)*t; }

function setupSimulatedAudio(){
  state.simulated = true;
  audioInputText.textContent = 'AUDIO INPUT SIMULATED';
  audioDot.style.background = '#ffcc55';
  audioDot.style.boxShadow = '0 0 6px #ffcc55';
}

async function initMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    logMsg('MIC ACCESS DENIED — FALLBACK TO SIMULATION', 'warn');
    setupSimulatedAudio();
    return false;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.75;
  micSource = audioCtx.createMediaStreamSource(micStream);
  micSource.connect(analyser);
  dataArrayFreq = new Uint8Array(analyser.frequencyBinCount);
  dataArrayTime = new Uint8Array(analyser.fftSize);
  state.hasMic = true;
  audioInputText.textContent = 'AUDIO INPUT ACTIVE';
  audioDot.style.background = '';
  audioDot.style.boxShadow = '';
  logMsg('AUDIO SYSTEM READY');
  return true;
}

function analyzeAudio(){
  if(!state.hasMic || !analyser){
    const t = performance.now()*0.001;
    const simVol = state.mode==='LISTENING' ? (Math.sin(t*2.3)*0.15+0.35+Math.random()*0.1) : (Math.sin(t*0.6)*0.05+0.08);
    state.volume = Math.max(0, Math.min(1, simVol));
    state.bass = state.volume*0.8 + Math.random()*0.1;
    state.mid = state.volume*0.6 + Math.random()*0.15;
    state.treble = state.volume*0.4 + Math.random()*0.2;
    drawFreqCanvas(null);
    freqValEl.textContent = '— Hz';
    ampValEl.textContent = state.volume.toFixed(2);
    voiceValEl.textContent = state.volume>0.55?'HIGH':(state.volume>0.22?'NORMAL':'LOW');
    signalValEl.textContent = 'SIMULATED';
    return;
  }

  analyser.getByteFrequencyData(dataArrayFreq);
  analyser.getByteTimeDomainData(dataArrayTime);

  let sumSq = 0;
  for(let i=0;i<dataArrayTime.length;i++){
    const v = (dataArrayTime[i]-128)/128;
    sumSq += v*v;
  }
  const rms = Math.sqrt(sumSq/dataArrayTime.length);
  state.volume = Math.max(0, Math.min(1, rms*3.2));

  const n = dataArrayFreq.length;
  const bassEnd = Math.floor(n*0.12);
  const midEnd = Math.floor(n*0.5);
  let bassSum=0, midSum=0, trebSum=0;
  for(let i=0;i<bassEnd;i++) bassSum += dataArrayFreq[i];
  for(let i=bassEnd;i<midEnd;i++) midSum += dataArrayFreq[i];
  for(let i=midEnd;i<n;i++) trebSum += dataArrayFreq[i];
  state.bass = (bassSum/bassEnd)/255;
  state.mid = (midSum/(midEnd-bassEnd))/255;
  state.treble = (trebSum/(n-midEnd))/255;

  let maxVal=0, maxIdx=0;
  for(let i=0;i<n;i++){ if(dataArrayFreq[i]>maxVal){maxVal=dataArrayFreq[i]; maxIdx=i;} }
  const nyquist = audioCtx.sampleRate/2;
  const domFreq = Math.round((maxIdx/n) * nyquist);

  drawFreqCanvas(dataArrayFreq);
  freqValEl.textContent = (maxVal>10 ? domFreq : 0) + ' Hz';
  ampValEl.textContent = state.volume.toFixed(2);
  voiceValEl.textContent = state.volume>0.5?'HIGH':(state.volume>0.18?'NORMAL':'LOW');
  signalValEl.textContent = state.volume>0.02?'STABLE':'IDLE';

  if(state.volume > 0.42 && Math.random() < 0.06){
    spawnShockWave();
  }
}

/* ============================================================
   RECONHECIMENTO DE VOZ
   ============================================================ */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognitionActive = false;

function setupRecognition(){
  if(!SpeechRecognitionAPI) return null;
  const rec = new SpeechRecognitionAPI();
  rec.lang = 'pt-BR';
  rec.continuous = true;
  rec.interimResults = true;

  rec.onresult = (event)=>{
    let finalTranscript = '';
    let interim = '';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTranscript += t;
      else interim += t;
    }
    if(finalTranscript.trim().length>0){
      addTranscriptLine('VOCÊ DISSE', finalTranscript.trim(), 'user');
      logMsg('COMMAND RECEIVED: "' + finalTranscript.trim().toUpperCase() + '"');
      handleUserUtterance(finalTranscript.trim());
    }
  };
  rec.onerror = (e)=>{
    logMsg('SPEECH RECOGNITION ERROR: ' + e.error, 'warn');
  };
  rec.onend = ()=>{
    if(recognitionActive){
      try{ rec.start(); }catch(e){}
    }
  };
  return rec;
}

function startSpeechRecognition(){
  if(!recognition) recognition = setupRecognition();
  if(!recognition){
    logMsg('SPEECH RECOGNITION UNAVAILABLE ON THIS BROWSER', 'warn');
    return;
  }
  try{
    recognitionActive = true;
    recognition.start();
    logMsg('VOICE RECOGNITION STARTED (pt-BR)');
  }catch(e){ }
}
function stopSpeechRecognition(){
  recognitionActive = false;
  if(recognition){
    try{ recognition.stop(); }catch(e){}
  }
  logMsg('VOICE RECOGNITION STOPPED');
}

/* ============================================================
   SÍNTESE DE VOZ
   ============================================================ */
function speak(text){
  if(!window.speechSynthesis){ return; }
  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('pt'));
  if(ptVoice) utter.voice = ptVoice;
  utter.lang = 'pt-BR';
  utter.rate = 1.02;
  utter.pitch = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ============================================================
   PROCESSAMENTO COM A IA
   ============================================================ */
const transcriptBox = document.getElementById('transcriptBox');
function addTranscriptLine(who, text, kind){
  const line = document.createElement('div');
  line.className = 'transcript-line' + (kind==='nexus' ? ' nexus':'');
  line.innerHTML = '<span class="who">' + who + '</span><span class="txt">"' + text + '"</span>';
  transcriptBox.innerHTML = '';
  transcriptBox.appendChild(line);
  requestAnimationFrame(()=> line.classList.add('show'));
}

async function processCommand(command) {
    try {
        const response = await fetch(OLLAMA_URL, {
            method: 'POST',
            headers: {
                // Apenas o Content-Type nativo, sem cabeçalhos para não causar bloqueio de segurança
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: OLLAMA_MODEL,
                prompt: command,
                system: SYSTEM_PROMPT,
                stream: false
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        return data.response.trim().replace(/\n+/g, ' ');

    } catch (error) {
        logMsg('CONNECTION ERROR: ' + error.message, 'err');
        return "Aviso: Falha de conexão com o núcleo neural local. Verifique os terminais do servidor.";
    }
}

async function handleUserUtterance(text){
  setMode('PROCESSING');
  logMsg('PROCESSING COMMAND VIA OLLAMA...');
  
  const response = await processCommand(text);
  
  setMode('RESPONDING');
  addTranscriptLine('NEXUS', response, 'nexus');
  logMsg('RESPONSE GENERATED');
  speak(response);
  
  const delay = Math.max(3500, response.length * 75);
  setTimeout(()=>{
    if(recognitionActive){ setMode('LISTENING'); }
    else { setMode('IDLE'); }
  }, delay);
}

/* ============================================================
   CONTROLES E ANIMAÇÕES
   ============================================================ */
const stateLabel = document.getElementById('stateLabel');
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');

const STATE_TEXT = {
  IDLE:'AGUARDANDO COMANDO',
  LISTENING:'OUVINDO...',
  PROCESSING:'PROCESSANDO...',
  RESPONDING:'RESPONDENDO...'
};

function setMode(mode){
  state.mode = mode;
  stateLabel.textContent = STATE_TEXT[mode];
  stateLabel.className = 'state-label ' + mode.toLowerCase();
  if(mode === 'PROCESSING'){
    spawnShockWave();
  }
}

let micArmed = false;
micBtn.addEventListener('click', async ()=>{

  // ---> TRUQUE DE DESBLOQUEIO DE ÁUDIO PARA CELULARES <---
  if(window.speechSynthesis) {
      let unlock = new SpeechSynthesisUtterance('');
      unlock.volume = 0;
      window.speechSynthesis.speak(unlock);
  }
  // ---> FIM DO TRUQUE <---

  if(!micArmed){
    micArmed = true;
    micBtn.classList.add('active');
    micHint.textContent = 'TOQUE PARA PARAR';
    logMsg('INITIALIZING AUDIO INPUT...');
    const ok = await initMic();
    if(ok){
      logMsg('MICROPHONE CONNECTED');
    }
    startSpeechRecognition();
    setMode('LISTENING');
  } else {
    micArmed = false;
    micBtn.classList.remove('active');
    micHint.textContent = 'TOQUE PARA FALAR';
    stopSpeechRecognition();
    if(micStream){
      micStream.getTracks().forEach(t=>t.stop());
    }
    state.hasMic = false;
    audioInputText.textContent = 'AUDIO INPUT STANDBY';
    audioDot.style.background = '';
    audioDot.style.boxShadow = '';
    setMode('IDLE');
    logMsg('SESSION ENDED');
  }
});

function checkCompat(){
  const warnEl = document.getElementById('compatWarning');
  let issues = [];
  if(!window.WebGLRenderingContext){ issues.push('WEBGL'); }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ issues.push('MICROPHONE'); }
  if(!SpeechRecognitionAPI){ issues.push('SPEECH RECOGNITION'); }
  if(issues.length>0){
    warnEl.style.display = 'block';
    warnEl.textContent = 'VOICE INTERFACE NOT AVAILABLE';
    logMsg('COMPAT ISSUES: ' + issues.join(', '), 'warn');
    setupSimulatedAudio();
    setTimeout(()=>{ warnEl.style.display = 'none'; }, 5000);
  }
}

const bootMessages = [
  'INITIALIZING NEURAL CORE...',
  'SYSTEM ONLINE',
  'AUDIO SYSTEM READY',
  'VOICE INTERFACE READY',
  'WAITING FOR COMMAND...'
];
let bootIdx = 0;
function bootStep(){
  if(bootIdx < bootMessages.length){
    logMsg(bootMessages[bootIdx]);
    bootIdx++;
    setTimeout(bootStep, 420);
  } else {
    checkCompat();
  }
}
bootStep();

const clock = new THREE.Clock();
let rotSpeed = 0.05;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  analyzeAudio();

  state.volumeSmooth = lerp(state.volumeSmooth, state.volume, 0.12);
  state.bassSmooth = lerp(state.bassSmooth, state.bass, 0.15);
  state.midSmooth = lerp(state.midSmooth, state.mid, 0.15);
  state.trebleSmooth = lerp(state.trebleSmooth, state.treble, 0.18);

  let stateFactor = 1.0;
  if(state.mode==='IDLE') stateFactor = 0.35;
  if(state.mode==='LISTENING') stateFactor = 1.0;
  if(state.mode==='PROCESSING') stateFactor = 1.5;
  if(state.mode==='RESPONDING') stateFactor = 1.25;

  const energy = state.volumeSmooth * stateFactor;

  const targetRot = 0.05 + energy*0.6 + (state.mode==='PROCESSING'?0.9:0);
  rotSpeed = lerp(rotSpeed, targetRot, 0.05);
  coreGroup.rotation.y += rotSpeed*dt;
  coreGroup.rotation.x = Math.sin(t*0.15)*0.08;

  const posAttr = sphereGeo.getAttribute('position');
  const arr = posAttr.array;
  for(let i=0;i<PARTICLE_COUNT;i++){
    const ix = i*3;
    const dx = dirVectors[ix], dy = dirVectors[ix+1], dz = dirVectors[ix+2];
    const seed = seeds[i];

    const expand = 1 + state.bassSmooth*0.55*stateFactor;
    const wobble = Math.sin(t*3.0 + seed) * state.midSmooth * 0.35 * stateFactor;
    const breathe = Math.sin(t*0.8 + seed*0.01) * 0.03;

    const r = SPHERE_RADIUS * (0.92 + (seed%100)/1000) * expand + wobble + breathe;

    arr[ix]   = dx * r + basePositions[ix]*0;
    arr[ix+1] = dy * r;
    arr[ix+2] = dz * r;
  }
  posAttr.needsUpdate = true;

  sphereMat.size = 0.09 + state.trebleSmooth*0.09*stateFactor + (state.mode==='PROCESSING'?0.02:0);
  sphereMat.opacity = 0.75 + state.volumeSmooth*0.25;

  const glowScale = 7.5 + state.volumeSmooth*3.2*stateFactor + Math.sin(t*2)*0.15;
  coreGlow.scale.set(glowScale, glowScale, 1);
  const innerScale = 3.2 + state.volumeSmooth*1.8*stateFactor;
  coreGlowInner.scale.set(innerScale, innerScale, 1);

  const orbitPosAttr = orbitGeo.getAttribute('position');
  const oArr = orbitPosAttr.array;
  for(let i=0;i<ORBIT_PARTICLE_COUNT;i++){
    orbitAngles[i] += (orbitSpeeds[i] * 0.01) * (1 + energy*1.5) * (dt*60);
    const rad = orbitRadii[i] * (1 + state.trebleSmooth*0.25);
    const ang = orbitAngles[i];
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    const y = Math.sin(ang*1.7 + orbitTilt[i]*4) * rad * orbitTilt[i] * 0.3;
    const ix = i*3;
    oArr[ix] = x; oArr[ix+1] = y; oArr[ix+2] = z;
  }
  orbitPosAttr.needsUpdate = true;
  orbitMat.opacity = 0.55 + state.volumeSmooth*0.4;

  rings.forEach((ring, idx)=>{
    ring.rotation.z += dt * (0.15 + idx*0.08) * (1 + energy*2);
    ring.material.opacity = (0.12 + idx*0.06) + state.volumeSmooth*0.25;
    const s = 1 + Math.sin(t*0.5 + idx)*0.02 + state.bassSmooth*0.06;
    ring.scale.set(s,s,s);
  });

  for(let i=shockWaves.length-1;i>=0;i--){
    const sw = shockWaves[i];
    sw.userData.life += dt*0.9;
    const s = 1 + sw.userData.life*2.2;
    sw.scale.set(s,s,s);
    sw.material.opacity = Math.max(0, 0.6 - sw.userData.life*0.6);
    if(sw.userData.life > 1){
      coreGroup.remove(sw);
      sw.geometry.dispose();
      sw.material.dispose();
      shockWaves.splice(i,1);
    }
  }

  camera.position.x = lerp(camera.position.x, state.mouseNX*0.6, 0.03);
  camera.position.y = lerp(camera.position.y, 0.4 + state.mouseNY*0.35, 0.03);
  camera.lookAt(0,0,0);

  starField.rotation.y += dt*0.01;
  starField.rotation.x += dt*0.003;

  renderer.render(scene, camera);
}
animate();

if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = ()=>{ };
}

})();
</script>
